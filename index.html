<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>श्री आरती संग्रह - Aarti Lyrics Collection</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Devanagari -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yatra+One&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-devanagari-sans: 'Noto Sans Devanagari', sans-serif;
            --font-devanagari-serif: 'Tiro Devanagari Marathi', serif;
            --font-devanagari-calligraphy: 'Yatra One', cursive;
            --font-devanagari-heading: 'Rozha One', serif;
        }

        body {
            font-family: var(--font-devanagari-sans);
            background: #11031d;
            color: #fce7f3;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        .festive-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2;
            background: radial-gradient(circle at 20% 20%, #6b1111 0%, transparent 40%),
                        radial-gradient(circle at 80% 30%, #4a044e 0%, transparent 50%),
                        radial-gradient(circle at 50% 80%, #78350f 0%, transparent 50%),
                        radial-gradient(circle at 10% 90%, #312e81 0%, transparent 40%),
                        linear-gradient(135deg, #0f021a 0%, #20052e 50%, #15001f 100%);
            background-attachment: fixed;
        }

        #bokehCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 0 12px 0 rgba(255, 215, 0, 0.08);
        }

        .glass-card-active {
            background: rgba(234, 88, 12, 0.25) !important;
            border: 1px solid rgba(251, 191, 36, 0.7) !important;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.35) !important;
        }

        .glass-bar {
            background: rgba(23, 7, 33, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
        }

        .glass-modal {
            background: rgba(18, 4, 28, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .glass-btn {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(225, 29, 72, 0.25));
            border: 1px solid rgba(251, 191, 36, 0.4);
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:active {
            transform: scale(0.95);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.4), rgba(225, 29, 72, 0.4));
        }

        .text-gold-gradient {
            background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 2, 26, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.4); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(245, 158, 11, 0.8); }

        .verse-block {
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            padding-left: 0.75rem;
        }
        .verse-block:hover {
            border-left-color: #f59e0b;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 0 8px 8px 0;
        }

        @keyframes subtlePulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }
        .pulse-glow { animation: subtlePulse 4s infinite ease-in-out; }
    </style>
</head>
<body class="relative min-h-screen text-slate-100 flex flex-col">

    <div class="festive-bg"></div>
    <canvas id="bokehCanvas"></canvas>

    <!-- HEADER -->
    <header class="sticky top-0 z-40 glass-bar shadow-2xl">
        <div class="max-w-7xl mx-auto px-3 py-2.5 flex items-center justify-between border-b border-amber-500/10">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-amber-400 text-xl border border-amber-400/40 pulse-glow">
                    🪔
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold tracking-wide text-gold-gradient" style="font-family: var(--font-devanagari-heading);">
                        आरती संग्रह
                    </h1>
                    <p class="text-[10px] md:text-xs text-amber-200/70">संपूर्ण नित्य आरती संग्रह by KRUTISH.A.GHARAT Arnala Jambhulpada</p>
                </div>
            </div>

            <div class="flex items-center gap-1.5 md:gap-2">
                <button onclick="openManageModal()" class="glass-btn px-2.5 py-1.5 rounded-xl text-xs md:text-sm font-medium flex items-center gap-1.5 text-amber-200 hover:text-white" title="आरती क्रम">
                    <i class="fa-solid fa-list-check text-amber-400"></i>
                    <span class="hidden sm:inline">क्रम व्यवस्थापन</span>
                </button>
                <button onclick="openCustomAartiModal()" class="glass-btn px-2.5 py-1.5 rounded-xl text-xs md:text-sm font-medium flex items-center gap-1.5 text-amber-200 hover:text-white" title="नवीन आरती जोडा">
                    <i class="fa-solid fa-plus text-emerald-400"></i>
                    <span class="hidden sm:inline">आरती जोडा</span>
                </button>
                <button onclick="openShareModal()" class="glass-btn p-2 rounded-xl text-xs md:text-sm text-amber-200 hover:text-white" title="शेअर करा">
                    <i class="fa-solid fa-qrcode text-amber-300"></i>
                </button>
                <button onclick="toggleFullscreen()" class="glass-btn p-2 rounded-xl text-xs md:text-sm text-amber-200 hover:text-white" title="फुलस्क्रीन">
                    <i class="fa-solid fa-expand text-amber-300" id="fsIcon"></i>
                </button>
            </div>
        </div>

        <div class="w-full bg-black/40 py-2 px-3 overflow-x-auto whitespace-nowrap scrollbar-none flex items-center gap-2" id="sequenceBarContainer">
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-3 py-4 md:py-6 flex flex-col gap-4">
        
        <section class="glass-card rounded-2xl p-3 md:p-4 flex flex-wrap items-center justify-between gap-3 text-xs md:text-sm">
            <div class="flex items-center flex-wrap gap-2 md:gap-4">
                <div class="flex items-center gap-1 bg-black/30 rounded-xl p-1 border border-amber-500/20">
                    <button onclick="adjustFontSize(-2)" class="w-8 h-8 rounded-lg glass-btn flex items-center justify-center font-bold text-amber-300 hover:bg-amber-500/20">A-</button>
                    <span id="fontSizeDisplay" class="px-2 font-mono text-amber-200 text-xs">22px</span>
                    <button onclick="adjustFontSize(2)" class="w-8 h-8 rounded-lg glass-btn flex items-center justify-center font-bold text-amber-300 hover:bg-amber-500/20">A+</button>
                </div>

                <div class="flex items-center gap-1 bg-black/30 rounded-xl p-1 border border-amber-500/20">
                    <button onclick="setFontFamily('sans')" id="fontBtnSans" class="px-2.5 py-1 rounded-lg text-xs font-medium transition-all bg-amber-500/30 text-amber-200 border border-amber-400/50">साधी</button>
                    <button onclick="setFontFamily('serif')" id="fontBtnSerif" class="px-2.5 py-1 rounded-lg text-xs font-medium transition-all text-amber-300 hover:bg-white/5">पारंपारिक</button>
                    <button onclick="setFontFamily('calligraphy')" id="fontBtnCalligraphy" class="px-2.5 py-1 rounded-lg text-xs font-medium transition-all text-amber-300 hover:bg-white/5">कलात्मक</button>
                </div>
            </div>

            <div class="flex items-center gap-2 bg-black/30 rounded-xl px-3 py-1.5 border border-amber-500/20 w-full sm:w-auto justify-between sm:justify-start">
                <button id="autoScrollToggleBtn" onclick="toggleAutoScroll()" class="glass-btn px-3 py-1 rounded-lg flex items-center gap-1.5 text-xs font-semibold text-emerald-300">
                    <i class="fa-solid fa-play" id="scrollPlayIcon"></i>
                    <span id="scrollStatusText">ऑटो-स्क्रोल चालू</span>
                </button>
                
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-gauge-high text-amber-400/70 text-xs"></i>
                    <input type="range" id="scrollSpeedSlider" min="1" max="10" value="3" oninput="updateScrollSpeed(this.value)" class="w-20 md:w-28 accent-amber-500 bg-amber-950/50 rounded-lg cursor-pointer">
                    <span id="speedValueDisplay" class="text-[11px] font-mono text-amber-300/80 w-6">3x</span>
                </div>
            </div>
        </section>

        <section class="glass-card rounded-3xl p-4 md:p-8 flex-grow relative overflow-hidden flex flex-col transition-all">
            <div class="text-center border-b border-amber-500/20 pb-5 mb-6 relative">
                <span id="aartiDeityBadge" class="inline-block px-3 py-1 rounded-full text-xs font-medium bg-amber-500/20 text-amber-300 border border-amber-400/30 mb-2">
                    श्री गणेश
                </span>
                <h2 id="aartiTitle" class="text-2xl md:text-4xl font-extrabold text-gold-gradient tracking-wide mb-1" style="font-family: var(--font-devanagari-heading);">
                    सुखकर्ता दुखहर्ता
                </h2>
                <p id="aartiSubtitle" class="text-xs md:text-sm text-amber-200/60 font-light">
                    (श्री गणपतीची आरती)
                </p>

                <button onclick="navigateAarti(-1)" class="absolute left-0 top-1/2 -translate-y-1/2 glass-btn w-10 h-10 rounded-full flex items-center justify-center text-amber-300 hover:text-white">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button onclick="navigateAarti(1)" class="absolute right-0 top-1/2 -translate-y-1/2 glass-btn w-10 h-10 rounded-full flex items-center justify-center text-amber-300 hover:text-white">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <div id="lyricsContent" class="lyrics-text-area leading-relaxed text-center space-y-6 py-2 transition-all duration-300 max-w-3xl mx-auto w-full">
            </div>

            <div class="mt-8 pt-4 border-t border-amber-500/20 flex items-center justify-between text-xs text-amber-200/70">
                <button onclick="navigateAarti(-1)" class="hover:text-amber-300 flex items-center gap-1">
                    <i class="fa-solid fa-arrow-left"></i> मागील आरती
                </button>
                <span id="aartiCounterText" class="font-mono text-amber-400/80">1 / 21</span>
                <button onclick="navigateAarti(1)" class="hover:text-amber-300 flex items-center gap-1">
                    पुढील आरती <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </section>
    </main>

    <!-- MODALS -->
    <div id="manageModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden flex items-center justify-center p-3">
        <div class="glass-modal w-full max-w-lg rounded-3xl p-5 md:p-6 shadow-2xl border border-amber-500/30 flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between border-b border-amber-500/20 pb-3 mb-4">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-bars-staggered text-amber-400 text-lg"></i>
                    <h3 class="text-lg font-bold text-amber-200">आरती क्रम व व्यवस्थापन</h3>
                </div>
                <button onclick="closeManageModal()" class="text-amber-400/60 hover:text-amber-200 text-xl font-bold px-2">&times;</button>
            </div>
            <div id="manageAartiList" class="overflow-y-auto space-y-2 flex-grow pr-1"></div>
            <div class="mt-4 pt-3 border-t border-amber-500/20 flex justify-between items-center">
                <button onclick="resetAartiOrder()" class="text-xs text-rose-400 hover:text-rose-300 underline">मूळ क्रम पुनर्संचयित करा</button>
                <button onclick="closeManageModal()" class="glass-btn px-5 py-2 rounded-xl text-xs font-bold text-amber-200">पूर्ण झाले</button>
            </div>
        </div>
    </div>

    <div id="customAartiModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden flex items-center justify-center p-3">
        <div class="glass-modal w-full max-w-xl rounded-3xl p-5 md:p-6 shadow-2xl border border-amber-500/30 flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between border-b border-amber-500/20 pb-3 mb-4">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-emerald-400 text-lg"></i>
                    <h3 class="text-lg font-bold text-amber-200">नवीन आरती जोडा</h3>
                </div>
                <button onclick="closeCustomAartiModal()" class="text-amber-400/60 hover:text-amber-200 text-xl font-bold px-2">&times;</button>
            </div>
            <form id="addAartiForm" onsubmit="handleSaveCustomAarti(event)" class="space-y-4 overflow-y-auto pr-1 flex-grow">
                <div>
                    <label class="block text-xs font-semibold text-amber-300 mb-1">आरतीचे नाव *</label>
                    <input type="text" id="newAartiTitle" required placeholder="उदा. श्री महालक्ष्मी आरती" class="w-full bg-black/50 border border-amber-500/30 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-amber-300 mb-1">उपशीर्षक</label>
                        <input type="text" id="newAartiSubtitle" placeholder="उदा. (देवीची आरती)" class="w-full bg-black/50 border border-amber-500/30 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-amber-300 mb-1">टॅग / वर्ग</label>
                        <input type="text" id="newAartiCategory" placeholder="उदा. श्री देवी" class="w-full bg-black/50 border border-amber-500/30 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-300 mb-1">आरतीचे साहित्य *</label>
                    <textarea id="newAartiLyrics" rows="8" required placeholder="येथे आरतीचे कडवे लिहा..." class="w-full bg-black/50 border border-amber-500/30 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400"></textarea>
                </div>
                <div class="pt-2 flex items-center justify-end gap-3">
                    <button type="button" onclick="closeCustomAartiModal()" class="px-4 py-2 rounded-xl text-xs text-amber-300 hover:bg-white/5">रद्द करा</button>
                    <button type="submit" class="glass-btn px-6 py-2 rounded-xl text-xs font-bold text-amber-200 bg-emerald-600/30 border-emerald-400/50">साठवा</button>
                </div>
            </form>
        </div>
    </div>

    <div id="shareModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden flex items-center justify-center p-3">
        <div class="glass-modal w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl border border-amber-500/30 relative">
            <button onclick="closeShareModal()" class="absolute right-4 top-4 text-amber-400/60 hover:text-amber-200 text-xl font-bold">&times;</button>
            <div class="w-12 h-12 rounded-full glass-card mx-auto flex items-center justify-center text-amber-400 text-2xl mb-3 border border-amber-400/40">📱</div>
            <h3 class="text-lg font-bold text-amber-200 mb-1">शेअर करा</h3>
            <div class="bg-white p-3 rounded-2xl inline-block my-4 shadow-lg">
                <img id="qrCodeImg" src="" alt="QR Code" class="w-44 h-44 rounded-lg mx-auto">
            </div>
            <button onclick="copyAppUrl()" class="w-full glass-btn py-2.5 rounded-xl text-xs font-bold text-amber-200 flex items-center justify-center gap-2">
                <i class="fa-regular fa-copy"></i>
                <span id="copyBtnText">लिंक कॉपी करा</span>
            </button>
        </div>
    </div>

    <!-- SCRIPT WITH UPDATED 21 AARTIS -->
    <script>
        const DEFAULT_AARTIS = [
            {
                id: "aarti_1",
                title: "सुखकर्ता दुखहर्ता",
                subtitle: "(श्री गणपतीची आरती)",
                category: "श्री गणेश",
                enabled: true,
                lyrics: `सुखकर्ता दुःखहर्ता वार्ता विघ्नाची ॥
नुरवी पुरवी प्रेम कृपा जयाची ॥
सर्वांगी सुंदर उटी शेंदूराची ॥
कंठी झळके माळ मुक्ताफळांची ॥ १ ॥

जय देव जय देव जय मंगलमूर्ती ॥
दर्शनमात्रे मनकामना पुरती ॥ जय देव जय देव ॥ धृ. ॥

रत्नखचित फरा तुज गौरीकुमरा ॥
चंदनाची उटी कुंकुमकेशरा ॥
हिरेजडीत मुकुट शोभतो बरा ॥
रूणझुणती नुपूरे चरणी घागरिया ॥ जय देव... ॥ २ ॥

लंबोदर पीतांबर फणिवरबंधना ॥
सरळ सोंड वक्रतुंड त्रिनयना ॥
दास रामाचा वाट पाहे सदना ॥
संकटी पावावे निर्वाणी रक्षावे सुरवरवंदना ॥
जय देव जय देव जय मंगलमूर्ती... ॥ ३ ॥`
            },
            {
                id: "aarti_2",
                title: "शेंदूर लाल चढायो",
                subtitle: "(श्री गणपतीची आरती)",
                category: "श्री गणेश",
                enabled: true,
                lyrics: `शेंदुर लाल चढायो अच्छा गजमुखको ॥
दोंदिल लाल बिराजे सुत गौरीहरको ॥
हाथ लिये गुडलड्डू सांई सुरवरको ॥
महिमा कहे न जाय लागत हूं पदको ॥ १ ॥

जय जय जी गणराज विद्यासुखदाता ॥
धन्य तुमारा दरसन मेरा मन रमता ॥ धृ. ॥

अष्टौ सिद्धी दासी संकटको बैरी ॥
विघ्नविनाशन मंगल मूरत अधिकारी ॥
कोटी सूरजप्रकाश ऐसी छबी तेरी ॥
गंडस्थल मदमस्तक झूले शशिहारी ॥ जय जय जी... ॥ २ ॥

भावभगतसे कोई शरणागत आवे ॥
संतत संपत सबही भरपूर पावे ॥
ऐसे तुम महाराज मोको अति भावे ॥
गोसावीनंदन निशिदिन गुण गावे ॥ जय जय जी... ॥ ३ ॥`
            },
            {
                id: "aarti_3",
                title: "नाना परिमळ दुर्वा",
                subtitle: "(श्री गणपतीची आरती)",
                category: "श्री गणेश",
                enabled: true,
                lyrics: `नाना परिमळ दुर्वा शेंदुर शमिपत्रे ॥
लाडू मोदक अन्नें परिपूरित पात्र ॥
ऐसें पूजन केल्या बीजाक्षर मंत्र ॥
अष्टहि सिद्धि नवनिधि देसी क्षणमात्रे ॥ १ ॥

जय देव जय देव जय मंगलमूर्ती ॥
तुझे गुण वर्णाया मज कैंची स्फूर्ती ॥ जय देव जय देव ॥ धृ. ॥

तुझें ध्यान निरंतर जे कोणी करिती ॥
त्यांचीं सकलहि पापें विघ्नेंही हरती ॥
वाजी वारण शिबिका सेवक सुत युवती ॥
सर्वहि पावुनी अंती भवसागर तरती ॥ जय देव... ॥ २ ॥

शरणागत सर्वस्वें भजती तव चरणीं ॥

        let aartisList = [];

            } else {

                localStorage.setItem('ganpati_gauri_aartis_v3', JSON.stringify(aartisList));

        }

            localStorage.setItem('ganpati_gauri_aartis_v3', JSON.stringify(aartisList));
        }

        function renderSequenceBar() {
            const container = document.getElementById('sequenceBarContainer');
            container.innerHTML = '';

            let enabledCount = 0;
            aartisList.forEach((item, index) => {
                if (!item.enabled) return;
                enabledCount++;

                const btn = document.createElement('button');
                btn.onclick = () => selectAartiByIndex(index);
                
                const isActive = (index === activeAartiIndex);
                btn.className = `px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-1.5 ${
                    isActive 
                    ? 'glass-card-active text-amber-200 border-amber-400 font-bold scale-105' 
                    : 'glass-card text-amber-100/70 hover:text-white hover:bg-white/10'
                }`;

                btn.innerHTML = `
                    <span class="text-[10px] opacity-75 font-mono bg-amber-500/20 px-1.5 py-0.5 rounded-full border border-amber-400/20">${enabledCount}</span>
                    <span>${item.title}</span>
                `;
                container.appendChild(btn);
            });
        }

        function selectAartiByIndex(index) {
            activeAartiIndex = index;
            renderSequenceBar();
            loadAartiContent(index);
        }

        function loadAartiContent(index) {
            if (index < 0 || index >= aartisList.length) return;
            activeAartiIndex = index;

            const item = aartisList[index];
            document.getElementById('aartiTitle').innerText = item.title;
            document.getElementById('aartiSubtitle').innerText = item.subtitle || '';
            document.getElementById('aartiDeityBadge').innerText = item.category || 'आरती';

            const enabledList = aartisList.filter(a => a.enabled);
            const activeEnabledPos = enabledList.findIndex(a => a.id === item.id) + 1;
            document.getElementById('aartiCounterText').innerText = `${activeEnabledPos > 0 ? activeEnabledPos : 1} / ${enabledList.length}`;

            const container = document.getElementById('lyricsContent');
            container.innerHTML = '';

            const verses = item.lyrics.split('\n\n');
            verses.forEach((verse) => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse-block text-amber-50 tracking-wide font-medium shadow-sm';
                verseDiv.style.fontSize = `${fontSizePx}px`;

                const lines = verse.split('\n');
                lines.forEach((line) => {
                    const lineSpan = document.createElement('div');
                    lineSpan.innerText = line;
                    if (line.includes('जय देव') || line.includes('जय देवी') || line.includes('धृ.') || line.includes('जय जय') || line.includes('श्रीराम')) {
                        lineSpan.className = 'text-gold-gradient font-bold my-1';
                    }
                    verseDiv.appendChild(lineSpan);
                });

                container.appendChild(verseDiv);
            });

            applyFontFamily();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigateAarti(direction) {
            let nextIndex = activeAartiIndex + direction;
            while (nextIndex >= 0 && nextIndex < aartisList.length && !aartisList[nextIndex].enabled) {
                nextIndex += direction;
            }
            if (nextIndex >= 0 && nextIndex < aartisList.length) {
                selectAartiByIndex(nextIndex);
            }
        }

        function adjustFontSize(delta) {
            fontSizePx = Math.max(16, Math.min(42, fontSizePx + delta));

        }

        function setFontFamily(type) {
            currentFontFamily = type;
            document.getElementById('fontBtnSans').className = `px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${type === 'sans' ? 'bg-amber-500/30 text-amber-200 border border-amber-400/50' : 'text-amber-300 hover:bg-white/5'}`;
            document.getElementById('fontBtnSerif').className = `px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${type === 'serif' ? 'bg-amber-500/30 text-amber-200 border border-amber-400/50' : 'text-amber-300 hover:bg-white/5'}`;
            document.getElementById('fontBtnCalligraphy').className = `px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${type === 'calligraphy' ? 'bg-amber-500/30 text-amber-200 border border-amber-400/50' : 'text-amber-300 hover:bg-white/5'}`;

        function applyFontFamily() {
            const container = document.getElementById('lyricsContent');
            if (currentFontFamily === 'sans') container.style.fontFamily = 'var(--font-devanagari-sans)';

            else if (currentFontFamily === 'calligraphy') container.style.fontFamily = 'var(--font-devanagari-calligraphy)';

        function toggleAutoScroll() {
            isAutoScrolling = !isAutoScrolling;
            const btn = document.getElementById('autoScrollToggleBtn');

            if (isAutoScrolling) {

                icon.className = "fa-solid fa-play";
                text.innerText = "ऑटो-स्क्रोल चालू";
                clearInterval(autoScrollInterval);
            }
        }

        function updateScrollSpeed(val) {

        function startAutoScrollTimer() {
            clearInterval(autoScrollInterval);
            const intervalMs = Math.max(20, 110 - (scrollSpeedFactor * 9));

                const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                if (currentScroll >= maxScroll - 2) toggleAutoScroll();
                else window.scrollBy(0, 1);

                        <div>
                            <h4 class="text-sm font-bold text-amber-200">${item.title}</h4>
                            <p class="text-[10px] text-amber-200/60">${item.subtitle || ''}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="moveAartiOrder(${index}, -1)" ${index === 0 ? 'disabled class="opacity-30 p-1.5"' : 'class="glass-btn p-1.5 rounded-lg text-amber-300"'} title="वर घ्या">
                            <i class="fa-solid fa-arrow-up text-xs"></i>
                        </button>
                        <button onclick="moveAartiOrder(${index}, 1)" ${index === aartisList.length - 1 ? 'disabled class="opacity-30 p-1.5"' : 'class="glass-btn p-1.5 rounded-lg text-amber-300"'} title="खाली घ्या">
                            <i class="fa-solid fa-arrow-down text-xs"></i>
                        </button>
                        ${item.isCustom ? `
                            <button onclick="deleteCustomAarti('${item.id}')" class="p-1.5 text-rose-400 ml-1" title="हटवा">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        ` : ''}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function toggleAartiVisibility(index) {
            aartisList[index].enabled = !aartisList[index].enabled;
            saveAartisToStorage();
            renderManageList();
        }

        function moveAartiOrder(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= aartisList.length) return;

            const temp = aartisList[index];
            aartisList[index] = aartisList[newIndex];
            aartisList[newIndex] = temp;

            if (activeAartiIndex === index) activeAartiIndex = newIndex;
            else if (activeAartiIndex === newIndex) activeAartiIndex = index;

            saveAartisToStorage();
            renderManageList();
        }

        function resetAartiOrder() {
            aartisList = JSON.parse(JSON.stringify(DEFAULT_AARTIS));
            saveAartisToStorage();
            renderManageList();
        }

        function openCustomAartiModal() {
            document.getElementById('customAartiModal').classList.remove('hidden');
        }

        function closeCustomAartiModal() {
            document.getElementById('customAartiModal').classList.add('hidden');
            document.getElementById('addAartiForm').reset();
        }

        function handleSaveCustomAarti(event) {
            event.preventDefault();
            const title = document.getElementById('newAartiTitle').value.trim();
            const subtitle = document.getElementById('newAartiSubtitle').value.trim();
            const category = document.getElementById('newAartiCategory').value.trim();
            const lyrics = document.getElementById('newAartiLyrics').value.trim();

            if (!title || !lyrics) return;

            const newAarti = {
                id: 'custom_' + Date.now(),
                title: title,
                subtitle: subtitle ? `(${subtitle})` : '',
                category: category || 'इतर आरती',
                enabled: true,
                isCustom: true,
                lyrics: lyrics
            };

            aartisList.push(newAarti);
            saveAartisToStorage();
            closeCustomAartiModal();
            renderSequenceBar();
            selectAartiByIndex(aartisList.length - 1);
        }

        function deleteCustomAarti(id) {
            aartisList = aartisList.filter(a => a.id !== id);
            saveAartisToStorage();
            renderManageList();
        }

        function openShareModal() { document.getElementById('shareModal').classList.remove('hidden'); }
        function closeShareModal() { document.getElementById('shareModal').classList.add('hidden'); }

        function generateQRCode() {
            const url = window.location.href;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}&color=800000`;
            document.getElementById('qrCodeImg').src = qrUrl;
        }

        function copyAppUrl() {
            const tempInput = document.createElement('input');
            tempInput.value = window.location.href;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            const btnText = document.getElementById('copyBtnText');
            btnText.innerText = "कॉपी झाले! ✓";
            setTimeout(() => { btnText.innerText = "लिंक कॉपी करा"; }, 2000);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                document.getElementById('fsIcon').className = "fa-solid fa-compress text-amber-300";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('fsIcon').className = "fa-solid fa-expand text-amber-300";
                }
            }
        }

        function initBokehCanvas() {
            const canvas = document.getElementById('bokehCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const particleCount = Math.min(35, Math.floor(window.innerWidth / 25));

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 4 + 1.5,
                    color: Math.random() > 0.4 ? 'rgba(251, 191, 36, ' : 'rgba(244, 63, 94, ',
                    alpha: Math.random() * 0.5 + 0.2,
                    speedY: - (Math.random() * 0.4 + 0.1),
                    speedX: (Math.random() - 0.5) * 0.3
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.y += p.speedY;
                    p.x += p.speedX;
                    if (p.y < -10) p.y = canvas.height + 10;
                    if (p.x < -10) p.x = canvas.width + 10;
                    if (p.x > canvas.width + 10) p.x = -10;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color + p.alpha + ')';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#f59e0b';
                    ctx.fill();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
